name: Build and Release

# Pushing a tag vX.Y.Z (git tag v1.0.7 && git push origin v1.0.7) builds that version, then
# creates the GitHub release "Release v1.0.7" with generated notes and the binaries attached.
# Pushes to main, pull requests and manual runs do the same tests and builds with version
# 0.0.<run number>, kept as workflow artifacts only.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # create the release and upload its assets

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      msix_version: ${{ steps.version.outputs.msix_version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: packaging/ci-version.sh

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install test dependencies (SSH test server, PuTTY key tests)
        run: |
          pip install paramiko
          sudo apt-get update && sudo apt-get install -y putty-tools
      - run: dotnet test --configuration Release

  linux:
    needs: [version, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: packaging/publish-linux.sh "${{ needs.version.outputs.version }}" x64
      - uses: actions/upload-artifact@v7
        with:
          name: ussh-linux-x64
          path: artifacts/linux/*.tar.gz

  msix:
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Unsigned: for Store submission (the Store signs it). Set the identity values from
      # Partner Center as repository variables before submitting.
      - name: Build MSIX
        shell: pwsh
        run: >
          ./packaging/build-msix.ps1
          -Version "${{ needs.version.outputs.msix_version }}"
          -Architecture x64,arm64
          -IdentityName "${{ vars.MSIX_IDENTITY_NAME || 'ussh.dev' }}"
          -Publisher "${{ vars.MSIX_PUBLISHER || 'CN=ussh-dev' }}"
          -PublisherDisplayName "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'ussh developer' }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ussh-msix
          path: artifacts/msix/*.msix

  release:
    # Only for version tags, and only once every build has succeeded.
    if: needs.version.outputs.is_release == 'true'
    needs: [version, linux, msix]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Release ${{ github.ref_name }}
          files: |
            dist/*.msix
            dist/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
